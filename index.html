<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#121212"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="價格"><title>價格追蹤儀表板</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>價格追蹤儀表板</h1><div id="updated" class="muted"></div></header>
<section id="summary" class="cards"></section>
<nav id="tabs"></nav>
<div class="bar">
<input id="q" type="search" placeholder="搜尋名稱或店家">
<select id="status"><option value="">全部狀態</option><option>降價</option><option>補貨</option><option>低庫存</option><option>缺貨</option><option>無變化</option></select>
<select id="sort"><option value="best">價格最好優先</option><option value="drop">降價幅度</option><option value="price">價格低到高</option><option value="checked">最後檢查</option></select>
<button id="add">新增</button><button id="export">匯出</button><button id="import">匯入</button><input id="file" type="file" accept="application/json" hidden><button id="reset">重設</button>
<button id="fbexport">匯出回饋</button><button id="fbimport">匯入回饋</button><input id="ffile" type="file" accept="application/json" hidden><a id="fblink" href="#" target="_blank" rel="noopener" hidden>送出回饋</a>
</div>
<div id="notice" class="muted"></div>
<main><div id="watch"></div><div id="list" class="grid"></div>
<aside id="logbox"><h2>最近變動</h2><ul id="log"></ul></aside></main>
<div id="drawer" hidden><div class="panel" id="panel"></div></div>
<dialog id="form"><form method="dialog" id="f">
<h3 id="ftitle">商品</h3>
<label>名稱<input name="name" required></label>
<label>分類<select name="category"><option>服飾</option><option>重訓器材</option><option>補給品</option><option>其他</option></select></label>
<label>基準價<input name="baseline" type="number" min="0" required></label>
<label>目標價<input name="target" type="number" min="0"></label>
<fieldset><legend>各店報價（卡片顯示最便宜且有貨者）</legend><div id="offered"></div><button type="button" id="addoffer">新增報價</button></fieldset>
<label>狀態<select name="status"><option>無變化</option><option>降價</option><option>補貨</option><option>缺貨</option></select></label>
<label class="chk"><input name="purchased" type="checkbox">已購買</label>
<label>備註<textarea name="note" rows="2"></textarea></label>
<div class="row"><button value="ok" id="save">儲存</button><button value="cancel" type="button" id="cancel">取消</button></div>
</form></dialog>
<script src="app.js?v=5"></script></body></html>
